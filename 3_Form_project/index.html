<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda seu Carro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
<div class="header">

    <h3>Cadastre seu veiculo para vender mais rapido</h3>
</div>
<div class="form-container">
<div class="form-header">
<p>Formulario</p>
<div class="form-body">
<h1 class="form-title">Venda facil seu carro</h1>
<p>Descreva as caracteriticas e marque os opcionais que ele possui</p>
<form>
    <div class="box-input">
    <label for="title">Título do anúncio <span class="required-field">*</span></label>
<input type="text" name="title" id="title" class="block" placeholder="Um titulo para anunciar seu carro" minlength="1" maxlength="30" required>

</div>
<div class="box-input">
    <label for="price">Preço <span class="required-field">*</span></label>
<input type="number" name="price" id="title" class="block" placeholder="Defina o preço" required>

</div>
<div class="box-input">
    <label for="description">Descrição<span class="required-field">*</span></label>
<textarea name="description"id="description" cols="30" rows="'0" placeholder="Aqui voce coloca detalhes do veiculo"></textarea>
</div>
 <div class="box-input">
    <label for="brand">Marca<span class="required-field">*</span></label>
<input type="text" name="brand" id="brand" class="block" placeholder="Digite a marca do seu veiculo" minlength="1" maxlength="30" required>

</div>

 <div class="box-input">
    <label for="model">Modelo<span class="required-field">*</span></label>
<input type="text" name="model" id="model" class="block" placeholder="Digite o modelo do seu veiculo" minlength="1" maxlength="30" required>

</div>

 <div class="box-input">
    <label for="model">Kilometragem<span class="required-field">*</span></label>
<input type="number" name="mileage" id="mileage" class="block" placeholder="Digite o kilometragem do seu veiculo" minlength="1" maxlength="30" required>

</div>

<div class="box-input">
    <label for="puchase_date">Data de compra<span class="required-field">*</span></label>
<input type="date" name="puchase_date" id="puchase_date" class="block" minlength="1" maxlength="30" required>

</div>

</div>



<input type="submit" value="Enviar">
</form>
</div>
    </div>
















</body>
</html>
